pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
        // Vendored sherpa-onnx AAR (NVIDIA Parakeet offline ASR). Not on Maven Central.
        flatDir { dirs "$rootDir/app/libs" }
    }
}
rootProject.name = "WhisperIME"
include ':app'
